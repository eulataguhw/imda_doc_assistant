name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: lint + typecheck + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck web (tsc)
        run: npx tsc -p apps/web/tsconfig.json --noEmit

      - name: Typecheck api (tsc)
        run: npx tsc -p apps/api/tsconfig.json --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests (all workspaces)
        run: npm test

      - name: Web coverage gate (>=80% all metrics)
        run: npm run test:coverage -w doc-web

      - name: API coverage gate (>=80% all metrics)
        run: npm run test:coverage -w doc-api
